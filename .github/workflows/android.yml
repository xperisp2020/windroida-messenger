name: Build Windroida APK

concurrency:
  group: android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["android/**"]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      WD_KS_PASS: ${{ secrets.WD_KS_PASS }}
      WD_KEY_ALIAS: ${{ secrets.WD_KEY_ALIAS }}
      WD_KEY_PASS: ${{ secrets.WD_KEY_PASS }}
      HAVE_KEY: ${{ secrets.WD_KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: 17 }
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: "12266719"
          accept-android-sdk-licenses: true
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with: { gradle-version: "8.7" }
      - name: Run Android unit tests
        run: gradle --no-daemon testDebugUnitTest
      # With the secret WD_KEYSTORE_B64 (base64 of your windroida.jks) the APK is a release APK signed with YOUR permanent key.
      # Without it, falls back to the old debug APK.
      - name: Restore signing key
        if: env.HAVE_KEY == 'true'
        run: echo "${{ secrets.WD_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/windroida.jks"
      - name: Build release (signed with your key)
        if: env.HAVE_KEY == 'true'
        run: WD_KEYSTORE="$RUNNER_TEMP/windroida.jks" gradle --no-daemon assembleRelease
      - name: Verify release packaging fails without an owner signing key
        if: env.HAVE_KEY != 'true'
        run: |
          if gradle --no-daemon assembleRelease > "$RUNNER_TEMP/release-signing-check.log" 2>&1; then
            cat "$RUNNER_TEMP/release-signing-check.log"
            echo "ERROR: release packaging unexpectedly succeeded without an owner key"
            exit 1
          fi
          cat "$RUNNER_TEMP/release-signing-check.log"
          grep -F "Release signing is not configured" "$RUNNER_TEMP/release-signing-check.log"
      - name: Build debug (no key configured)
        if: env.HAVE_KEY != 'true'
        run: gradle --no-daemon assembleDebug
      # Emulator boot is not reliable on every hosted runner. Keep this end-to-end
      # device test available on demand; PR validation still builds the APK and
      # runs the embedded Python host lifecycle tests on Linux and Windows.
      - name: Run Android phone-host integration test on emulator
        if: github.event_name == 'workflow_dispatch'
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_I_WANT_MY_TCG: "yes"
        with:
          api-level: 34
          emulator-boot-timeout: 900
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: gradle --no-daemon connectedDebugAndroidTest
      - uses: actions/upload-artifact@v7
        with:
          name: windroida-apk
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore
